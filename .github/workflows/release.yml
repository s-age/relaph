name: Release

# Publish to npm when a version tag (v*) is pushed.
# Requires repository secret NPM_TOKEN (an npm automation token).
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # enables npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # Build explicitly so the workflow's intent is self-evident.
      - run: npm run build
      # publish; prepublishOnly (typecheck + test + build) re-verifies as a safety net.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
